<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>日本地図でめぐる！旅サラダはまちゃん資料館</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: #f7f7f7;
      color: #333;
    }

    header {
      text-align: center;
      padding: 40px 20px 25px;
      background: white;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #666;
    }

    main {
      width: min(1200px, calc(100% - 30px));
      margin: 30px auto 60px;
    }


    /* =========================
       日本地図
    ========================= */

    .map-section {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .map-section h2 {
      margin-top: 0;
      text-align: center;
    }

    .map-note {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .map-viewport {
      width: 100%;
      display: flex;
      justify-content: center;
    }


    /*
      PC版日本地図

      13列 × 14行
    */

    .japan-map {
      display: grid;

      grid-template-columns:
        repeat(13, 58px);

      grid-auto-rows: 48px;

      gap: 4px;

      width: max-content;

      padding: 8px;
    }


    .prefecture {
      border: 0;
      border-radius: 8px;

      padding: 4px;

      background: #eeeeee;
      color: #aaa;

      font-size: 11px;
      line-height: 1.25;

      cursor: default;

      transition:
        transform 0.15s,
        background 0.15s,
        box-shadow 0.15s;
    }


    .prefecture.has-video {
      background: #e5d6f5;
      color: #55366f;
      font-weight: bold;
      cursor: pointer;
    }


    .prefecture.has-video:hover {
      transform: translateY(-2px);
      background: #d6bdec;

      box-shadow:
        0 4px 10px
        rgba(85, 54, 111, 0.18);
    }


    .prefecture.selected {
      background: #765091;
      color: white;
    }


    .count {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      opacity: 0.8;
    }


    /* =========================
       動画一覧
    ========================= */

    .result-section {
      display: none;
    }

    .result-section.show {
      display: block;
    }

    .result-header {
      margin: 35px 0 20px;
    }

    #resultTitle {
      margin-bottom: 5px;
    }

    #resultCount {
      color: #777;
    }


    .video-list {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 22px;
    }


    .video-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;

      box-shadow:
        0 3px 12px
        rgba(0, 0, 0, 0.08);
    }


    .thumbnail-link {
      display: block;
      background: #ddd;
    }


    .thumbnail {
      display: block;
      width: 100%;

      aspect-ratio: 16 / 9;
      object-fit: cover;
    }


    .video-info {
      padding: 17px;
    }


    .location {
      margin-bottom: 8px;

      font-size: 14px;
      color: #765091;
      font-weight: bold;
    }


    .video-title {
      margin: 0 0 12px;

      font-size: 17px;
      line-height: 1.5;
    }


    .introduced {
      margin: 0 0 12px;
      line-height: 1.6;
    }


    .meta {
      color: #888;
      font-size: 13px;
      margin-bottom: 15px;
    }


    .youtube-link {
      display: inline-block;

      text-decoration: none;

      background: #333;
      color: white;

      padding: 9px 14px;
      border-radius: 8px;

      font-size: 14px;
    }


    .youtube-link:hover {
      opacity: 0.8;
    }


    .error {
      background: #fff0f0;
      color: #a00;

      padding: 20px;
      border-radius: 10px;
    }


    /* =========================
       タブレット
    ========================= */

    @media (max-width: 900px) {

      .video-list {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }


    /* =========================
       スマホ
    ========================= */

    @media (max-width: 700px) {

      body {
        background: #f5f5f5;
      }


      header {
        padding: 26px 14px 20px;
      }


      h1 {
        font-size: 22px;
        line-height: 1.45;
      }


      header p {
        font-size: 14px;
        line-height: 1.6;
      }


      main {
        width: calc(100% - 12px);
        margin: 12px auto 40px;
      }


      .map-section {
        padding: 18px 4px 20px;
        border-radius: 16px;
      }


      .map-section h2 {
        font-size: 18px;

        padding: 0 10px;
        margin-bottom: 12px;
      }


      .map-note {
        font-size: 12px;
        line-height: 1.5;

        margin-bottom: 18px;
        padding: 0 8px;
      }


      /*
        ★ Ver.0.05

        スマホでは縮小しない。

        9列の縦長日本列島へ
        配置そのものを変更！
      */

      .japan-map {
        grid-template-columns:
          repeat(9, minmax(0, 1fr));

        grid-auto-rows: 43px;

        gap: 3px;

        width: 100%;

        padding: 4px;
      }


      .prefecture {
        min-width: 0;

        padding: 2px;

        border-radius: 7px;

        font-size: 10px;
      }


      .count {
        font-size: 9px;
        margin-top: 1px;
      }


      .video-list {
        grid-template-columns: 1fr;
      }


      .result-header {
        margin-top: 25px;
      }

    }

  </style>
</head>


<body>

<header>

  <h1>
    🗾 日本地図でめぐる！<br>
    旅サラダはまちゃん資料館
  </h1>

  <p>
    都道府県をクリックすると、
    その土地の動画が見つかります。
  </p>

</header>


<main>

  <section class="map-section">

    <h2>
      行きたい都道府県を選んでね
    </h2>

    <p class="map-note">
      💜 色がついている都道府県には
      はまちゃんの動画があります
    </p>


    <div class="map-viewport">

      <div
        class="japan-map"
        id="japanMap"
      ></div>

    </div>

  </section>



  <section
    class="result-section"
    id="resultSection"
  >

    <div class="result-header">

      <h2 id="resultTitle"></h2>

      <div id="resultCount"></div>

    </div>


    <div
      class="video-list"
      id="videoList"
    ></div>

  </section>

</main>


<script>


/* ==================================================
   PC版 日本地図配置
================================================== */

const desktopPositions = {

  "青森県": { row: 3, col: 12 },

  "秋田県": { row: 4, col: 11 },
  "岩手県": { row: 4, col: 12 },

  "山形県": { row: 5, col: 11 },
  "宮城県": { row: 5, col: 12 },

  "福島県": { row: 6, col: 12 },


  "茨城県": { row: 7, col: 13 },
  "栃木県": { row: 7, col: 12 },
  "群馬県": { row: 7, col: 11 },

  "埼玉県": { row: 8, col: 12 },

  "千葉県": { row: 9, col: 13 },
  "東京都": { row: 9, col: 12 },

  "神奈川県": { row: 10, col: 12 },


  "新潟県": { row: 6, col: 10 },

  "富山県": { row: 7, col: 9 },
  "石川県": { row: 7, col: 8 },

  "福井県": { row: 8, col: 7 },

  "山梨県": { row: 9, col: 11 },
  "長野県": { row: 8, col: 10 },


  "岐阜県": { row: 9, col: 8 },

  "静岡県": { row: 10, col: 10 },
  "愛知県": { row: 10, col: 9 },

  "三重県": { row: 11, col: 8 },


  "滋賀県": { row: 9, col: 7 },

  "大阪府": { row: 10, col: 6 },
  "兵庫県": { row: 10, col: 5 },
  "奈良県": { row: 10, col: 7 },

  "和歌山県": { row: 11, col: 6 },


  "鳥取県": { row: 9, col: 4 },
  "島根県": { row: 9, col: 3 },

  "岡山県": { row: 10, col: 4 },
  "広島県": { row: 10, col: 3 },
  "山口県": { row: 10, col: 2 },


  "徳島県": { row: 12, col: 5 },

  "高知県": { row: 13, col: 4 },


  "福岡県": { row: 9, col: 1 },

  "宮崎県": { row: 12, col: 2 },

  "鹿児島県": { row: 13, col: 2 },

  "沖縄県": { row: 14, col: 1 }

};



/* ==================================================
   ★ スマホ版 日本地図配置

   9列で縦長に再設計
================================================== */

const mobilePositions = {

  /*
    北海道
  */

  "北海道": { row: 1, col: 8 },


  /*
    東北
  */

  "青森県": { row: 3, col: 7 },

  "秋田県": { row: 4, col: 6 },
  "岩手県": { row: 4, col: 7 },

  "山形県": { row: 5, col: 6 },
  "宮城県": { row: 5, col: 7 },

  "福島県": { row: 6, col: 7 },


  /*
    関東
  */

  "群馬県": { row: 7, col: 6 },
  "栃木県": { row: 7, col: 7 },
  "茨城県": { row: 7, col: 8 },

  "埼玉県": { row: 8, col: 7 },

  "山梨県": { row: 9, col: 6 },
  "東京都": { row: 9, col: 7 },
  "千葉県": { row: 9, col: 8 },

  "神奈川県": { row: 10, col: 7 },


  /*
    甲信越・北陸
  */

  "新潟県": { row: 7, col: 5 },

  "富山県": { row: 8, col: 4 },
  "長野県": { row: 8, col: 5 },

  "石川県": { row: 9, col: 4 },

  "福井県": { row: 10, col: 4 },


  /*
    東海
  */

  "岐阜県": { row: 10, col: 5 },

  "静岡県": { row: 11, col: 6 },
  "愛知県": { row: 11, col: 5 },

  "三重県": { row: 12, col: 5 },


  /*
    近畿
  */

  "滋賀県": { row: 11, col: 4 },
  "京都府": { row: 11, col: 3 },

  "兵庫県": { row: 12, col: 2 },
  "大阪府": { row: 12, col: 3 },
  "奈良県": { row: 12, col: 4 },

  "和歌山県": { row: 13, col: 3 },


  /*
    中国
  */

  "島根県": { row: 14, col: 1 },
  "鳥取県": { row: 14, col: 2 },

  "山口県": { row: 15, col: 1 },
  "広島県": { row: 15, col: 2 },
  "岡山県": { row: 15, col: 3 },


  /*
    四国
  */

  "香川県": { row: 16, col: 3 },

  "愛媛県": { row: 17, col: 2 },
  "徳島県": { row: 17, col: 3 },

  "高知県": { row: 18, col: 2 },


  /*
    九州
  */

  "福岡県": { row: 16, col: 1 },

  "佐賀県": { row: 17, col: 1 },

  "長崎県": { row: 18, col: 1 },

  "大分県": { row: 16, col: 2 },

  "熊本県": { row: 19, col: 2 },

  "宮崎県": { row: 20, col: 2 },

  "鹿児島県": { row: 21, col: 2 },


  /*
    沖縄
  */

  "沖縄県": { row: 22, col: 1 }

};



/* ==================================================
   HTML要素
================================================== */

const mapElement =
  document.getElementById(
    "japanMap"
  );


const resultSection =
  document.getElementById(
    "resultSection"
  );


const resultTitle =
  document.getElementById(
    "resultTitle"
  );


const resultCount =
  document.getElementById(
    "resultCount"
  );


const videoList =
  document.getElementById(
    "videoList"
  );



/* ==================================================
   動画データ
================================================== */

let videos = [];


/*
  現在PC配置かスマホ配置かを記録
*/

let currentMapMode = "";



/* ==================================================
   JSON読み込み
================================================== */

async function loadVideos() {

  try {

    const response =
      await fetch("./videos.json");


    if (!response.ok) {

      throw new Error(
        "videos.json を読み込めませんでした。"
      );

    }


    videos =
      await response.json();


    console.log(
      `${videos.length}本の動画を読み込みました`
    );


    createMap();


  } catch (error) {

    console.error(error);


    mapElement.innerHTML = `

      <div class="error">

        videos.json を読み込めませんでした。<br>

        Live Serverで開いているか
        確認してください。

      </div>

    `;

  }

}



/* ==================================================
   PC / スマホ判定
================================================== */

function isMobile() {

  return window.matchMedia(
    "(max-width: 700px)"
  ).matches;

}



/* ==================================================
   日本地図を作る
================================================== */

function createMap() {


  const mobile =
    isMobile();


  const newMode =
    mobile
      ? "mobile"
      : "desktop";


  currentMapMode =
    newMode;


  const positions =
    mobile
      ? mobilePositions
      : desktopPositions;


  mapElement.innerHTML = "";


  Object.entries(
    positions
  ).forEach(
    ([prefecture, position]) => {


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "prefecture";


      button.style.gridRow =
        position.row;


      button.style.gridColumn =
        position.col;



      /*
        この県にある動画
      */

      const prefectureVideos =
        videos.filter(
          video =>
            video["都道府県"] ===
            prefecture
        );


      const count =
        prefectureVideos.length;



      button.innerHTML =
        `<span>${prefecture}</span>`;



      /*
        動画あり
      */

      if (count > 0) {

        button.classList.add(
          "has-video"
        );


        button.innerHTML +=
          `<span class="count">
            🎬 ${count}
          </span>`;


        button.addEventListener(
          "click",
          () =>
            showVideos(
              prefecture,
              button
            )
        );

      }


      mapElement.appendChild(
        button
      );

    }
  );

}



/* ==================================================
   ブラウザ幅が変わったとき

   PC ⇔ スマホの境界を越えた時だけ
   地図を作り直す
================================================== */

window.addEventListener(
  "resize",
  () => {


    const newMode =
      isMobile()
        ? "mobile"
        : "desktop";


    if (
      newMode !==
      currentMapMode
    ) {

      createMap();

    }

  }
);



/* ==================================================
   動画表示
================================================== */

function showVideos(
  prefecture,
  clickedButton
) {


  document
    .querySelectorAll(
      ".prefecture"
    )
    .forEach(
      button =>
        button.classList.remove(
          "selected"
        )
    );


  clickedButton
    .classList
    .add("selected");



  const filteredVideos =
    videos.filter(
      video =>
        video["都道府県"] ===
        prefecture
    );



  /*
    公開日の新しい順
  */

  filteredVideos.sort(
    (a, b) =>
      new Date(b["公開日"]) -
      new Date(a["公開日"])
  );



  resultTitle.textContent =
    `📍 ${prefecture}`;


  resultCount.textContent =
    `${filteredVideos.length}本の動画があります`;



  videoList.innerHTML = "";



  filteredVideos.forEach(
    video => {

      const card =
        createVideoCard(video);


      videoList.appendChild(
        card
      );

    }
  );



  resultSection
    .classList
    .add("show");



  resultSection.scrollIntoView({

    behavior: "smooth",

    block: "start"

  });

}



/* ==================================================
   動画カード
================================================== */

function createVideoCard(video) {


  const card =
    document.createElement(
      "article"
    );


  card.className =
    "video-card";



  const thumbnailUrl =
    `https://i.ytimg.com/vi/${video["動画ID"]}/hqdefault.jpg`;



  const location =
    video["市区町村"]

      ? `${video["都道府県"]} ${video["市区町村"]}`

      : video["都道府県"];



  const introduced =
    video["紹介したもの"]

      ? escapeHTML(
          video["紹介したもの"]
        )

      : "";



  const tags =
    video["内容タグ"]

      ? escapeHTML(
          video["内容タグ"]
        )

      : "";



  card.innerHTML = `


    <a
      class="thumbnail-link"

      href="${escapeAttribute(
        video["URL"]
      )}"

      target="_blank"

      rel="noopener noreferrer"
    >

      <img
        class="thumbnail"

        src="${thumbnailUrl}"

        alt=""

        loading="lazy"
      >

    </a>



    <div class="video-info">


      <div class="location">

        📍 ${escapeHTML(location)}

      </div>



      <h3 class="video-title">

        ${escapeHTML(
          video["タイトル"]
        )}

      </h3>



      ${
        introduced

          ? `
            <p class="introduced">

              🍴 ${introduced}

            </p>
          `

          : ""
      }



      ${
        tags

          ? `
            <p class="introduced">

              🏷️ ${tags}

            </p>
          `

          : ""
      }



      <div class="meta">

        ${escapeHTML(
          video["公開日"]
        )}

        ${
          video["動画／ショート"]

            ? ` ｜ ${escapeHTML(
                video["動画／ショート"]
              )}`

            : ""
        }

      </div>



      <a
        class="youtube-link"

        href="${escapeAttribute(
          video["URL"]
        )}"

        target="_blank"

        rel="noopener noreferrer"
      >

        ▶ YouTubeで見る

      </a>


    </div>

  `;


  return card;

}



/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHTML(value) {

  return String(
    value ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



function escapeAttribute(value) {

  return escapeHTML(value);

}



/* ==================================================
   START
================================================== */

loadVideos();


</script>

</body>
</html>
